[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "panda-popdex-agent-wallet"
version = "0.1.0"
description = "Auditable POPDEX Agent wallet creation, inspection, and authorization tools"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "httpx>=0.27,<1",
  "web3>=7,<8",
]

[project.scripts]
popdex-agent-authorize = "panda_agent_wallet.authorize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_agent_wallet"]
